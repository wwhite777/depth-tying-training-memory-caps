# v1 (PREREGISTERED_loopbudget_v1.yaml with CONTRIBUTION_CONTRACT.md) stays unchanged; the block 'amends' lists every change.
# Changes only via DECISION_LOG and a v3.
protocol: loopbudget
version: 2
status: FROZEN
